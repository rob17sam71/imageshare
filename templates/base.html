<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    
    <title>Document</title>
</head>
<body class="p-3 mb-2 bg-dark-subtle text-dark-emphasis">
   {% include "includes/navbar.html" %}
    
{% if messages %}
   {% for message in messages %}
    <div class="bg-{% if message.tags %}{{ message.tags }}{% else %}success{% endif %} bg-gradient text-center text-white py-4">{{ message }}</div>
    {% endfor %}
       
{% endif %}


<div class="container bg-success p-2 text-dark bg-opacity-25 rounded-4" > 
    {% block content%} {% endblock %}
</div>
</body>
</html>
